name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan folder web
        run: |
          mkdir www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/

      - name: Bungkus dengan Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Glink Network" id.glink.network --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Glink Network v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
